<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>لوحة الإدارة - البيت الرقمي</title>
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display-all" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --ios-bg-primary: #0A2F2F;
            --glass-bg: rgba(12, 45, 45, 0.65);
            --glass-border: 0.5px solid rgba(247, 249, 249, 0.15);
            --glass-blur: blur(40px) saturate(210%) brightness(1.1);
            --ios-orange: #FF9F1C;
            --ios-green: #2EC4B6;
            --ios-red: #E71D36;
            --ios-purple: #5A9A9A;
            --ios-label-primary: #F7F9F9;
            --ios-label-secondary: rgba(247, 249, 249, 0.8);
            --ios-spring: cubic-bezier(0.25, 1, 0.2, 1);
            --radius-xl: 28px;
            --sat: env(safe-area-inset-top);
            --sab: env(safe-area-inset-bottom);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'SF Pro Display', 'Cairo', -apple-system, sans-serif;
        }

        body {
            background: var(--ios-bg-primary);
            color: var(--ios-label-primary);
            direction: rtl;
            min-height: 100vh;
            padding-top: var(--sat);
            padding-bottom: var(--sab);
        }

        .admin-header {
            background: rgba(10, 47, 47, 0.95);
            backdrop-filter: blur(60px);
            border-bottom: var(--glass-border);
            padding: 16px 24px;
            padding-top: calc(16px + var(--sat));
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .admin-header h1 {
            font-size: 20px;
            color: var(--ios-green);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 28px;
            color: var(--ios-orange);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-email {
            background: rgba(247, 249, 249, 0.1);
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 14px;
            color: var(--ios-label-secondary);
        }

        .logout-btn {
            background: rgba(231, 29, 54, 0.2);
            color: var(--ios-red);
            border: 1px solid rgba(231, 29, 54, 0.3);
            padding: 8px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: rgba(231, 29, 54, 0.4);
            transform: translateY(-2px);
        }

        .admin-content {
            max-width: 1300px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        /* Login Section */
        .login-container {
            max-width: 480px;
            margin: 80px auto;
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 40px 32px;
            text-align: center;
        }

        .login-icon {
            font-size: 64px;
            color: var(--ios-orange);
            margin-bottom: 20px;
        }

        .login-title {
            font-size: 28px;
            font-weight: 800;
            color: var(--ios-green);
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: var(--ios-label-secondary);
            margin-bottom: 32px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 24px;
            text-align: right;
        }

        .form-label {
            display: block;
            color: var(--ios-label-secondary);
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .ios-input {
            width: 100%;
            background: rgba(247, 249, 249, 0.1);
            border: var(--glass-border);
            border-radius: 14px;
            padding: 16px 18px;
            color: var(--ios-label-primary);
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }

        .ios-input:focus {
            border-color: var(--ios-orange);
            box-shadow: 0 0 0 4px rgba(255, 159, 28, 0.1);
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--ios-green) 0%, #25A89C 100%);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
            box-shadow: 0 8px 30px rgba(46, 196, 182, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(46, 196, 182, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: rgba(231, 29, 54, 0.2);
            border: 1px solid rgba(231, 29, 54, 0.3);
            color: #FF6B6B;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* Dashboard Grid */
        .dashboard-header {
            margin-bottom: 32px;
        }

        .dashboard-header h2 {
            font-size: 24px;
            font-weight: 800;
            color: var(--ios-orange);
            margin-bottom: 8px;
        }

        .dashboard-header p {
            color: var(--ios-label-secondary);
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-top: 24px;
        }

        .tool-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            transition: all 0.3s var(--ios-spring);
            text-decoration: none;
            color: var(--ios-label-primary);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tool-card:hover {
            transform: translateY(-6px);
            border-color: var(--ios-orange);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .tool-icon {
            font-size: 42px;
            color: var(--ios-orange);
        }

        .tool-title {
            font-size: 18px;
            font-weight: 800;
            margin-top: 8px;
        }

        .tool-desc {
            font-size: 13px;
            color: var(--ios-label-secondary);
            line-height: 1.5;
        }

        .tool-badge {
            background: rgba(46, 196, 182, 0.2);
            color: var(--ios-green);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            align-self: flex-start;
            margin-top: 8px;
        }

        .hidden {
            display: none;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 60, 60, 0.95);
            color: white;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 600;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s;
            backdrop-filter: blur(10px);
        }

        .toast.show { opacity: 1; }
        .toast.error { background: rgba(231, 29, 54, 0.95); }
        .toast.success { background: rgba(46, 196, 182, 0.95); }

        footer {
            text-align: center;
            padding: 24px;
            color: var(--ios-label-secondary);
            font-size: 13px;
            border-top: 1px solid rgba(247, 249, 249, 0.05);
            margin-top: 40px;
        }

        @media (max-width: 640px) {
            .admin-content {
                padding: 20px 16px;
            }
            .tools-grid {
                grid-template-columns: 1fr;
            }
            .login-container {
                margin: 40px auto;
                padding: 0 16px;
            }
        }
    </style>
</head>
<body>
    <header class="admin-header">
        <div class="logo-area">
            <i class="fas fa-store logo-icon"></i>
            <h1>البيت الرقمي | لوحة الإدارة</h1>
        </div>
        <div class="user-info" id="userInfoArea" style="display: none;">
            <span class="user-email" id="userEmailSpan"></span>
            <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> خروج</button>
        </div>
    </header>

    <div class="admin-content">
        <!-- Login Section (hidden when logged in) -->
        <div id="loginSection" class="login-container">
            <div class="login-card">
                <div class="login-icon">
                    <i class="fas fa-lock"></i>
                </div>
                <div class="login-title">تسجيل الدخول</div>
                <div class="login-subtitle">أدخل بريدك الإلكتروني وكلمة المرور للوصول إلى لوحة التحكم</div>
                
                <div id="loginError" class="error-message"></div>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label"><i class="fas fa-envelope"></i> البريد الإلكتروني</label>
                        <input type="email" id="loginEmail" class="ios-input" placeholder="admin@example.com" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label class="form-label"><i class="fas fa-key"></i> كلمة المرور</label>
                        <input type="password" id="loginPassword" class="ios-input" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn-primary" id="loginBtn">
                        <i class="fas fa-arrow-left"></i> دخول
                    </button>
                </form>
            </div>
        </div>

        <!-- Dashboard Section (hidden when not logged in) -->
        <div id="dashboardSection" class="hidden">
            <div class="dashboard-header">
                <h2><i class="fas fa-th-large"></i> لوحة الأدوات الإدارية</h2>
                <p>مرحباً بك في نظام إدارة البيت الرقمي، اختر الأداة التي تريد استخدامها:</p>
            </div>
            <div class="tools-grid" id="toolsGrid">
                <!-- Links will be populated dynamically -->
            </div>
        </div>
        <footer>
            <i class="fas fa-shield-alt"></i> نظام إدارة آمن | جميع الحقوق محفوظة © 2025
        </footer>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

        // Firebase configuration (provided)
        const firebaseConfig = {
            apiKey: "AIzaSyC2f4rJBBBOe6qfa2EU1WfspUB5uibgwnM",
            authDomain: "hussain-1290b.firebaseapp.com",
            projectId: "hussain-1290b",
            storageBucket: "hussain-1290b.firebasestorage.app",
            messagingSenderId: "798281706738",
            appId: "1:798281706738:web:79314f6feb2add0bf5f46b",
            measurementId: "G-107DF3Y7ZC"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // DOM elements
        const loginSection = document.getElementById('loginSection');
        const dashboardSection = document.getElementById('dashboardSection');
        const userInfoArea = document.getElementById('userInfoArea');
        const userEmailSpan = document.getElementById('userEmailSpan');
        const logoutBtn = document.getElementById('logoutBtn');
        const loginForm = document.getElementById('loginForm');
        const loginEmail = document.getElementById('loginEmail');
        const loginPassword = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const toolsGrid = document.getElementById('toolsGrid');

        // Helper: show toast notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.innerHTML = type === 'error' ? `<i class="fas fa-exclamation-triangle"></i> ${message}` : `<i class="fas fa-check-circle"></i> ${message}`;
            toast.className = `toast ${type === 'error' ? 'error' : 'success'} show`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // List of admin tools (all your existing files)
        const adminTools = [
            {
                title: "➕ إضافة منتج",
                desc: "إضافة منتج جديد مع صور، ألوان، سؤال مخصص، وعرض فقط.",
                icon: "fas fa-plus-circle",
                link: "admin-add.html",
                badge: "شائع"
            },
            {
                title: "✏️ تعديل المنتجات",
                desc: "تعديل بيانات المنتجات، إدارة الصور، الخصومات والألوان.",
                icon: "fas fa-edit",
                link: "admin-edit.html",
                badge: "متقدم"
            },
            {
                title: "📦 قائمة المنتجات",
                desc: "عرض جميع المنتجات وحذفها بسهولة.",
                icon: "fas fa-boxes",
                link: "admin-products.html",
                badge: ""
            },
            {
                title: "👁️ عرض المنتجات (بدون أسعار)",
                desc: "عرض المنتجات في وضع القراءة فقط بدون أسعار للتصفح الداخلي.",
                icon: "fas fa-eye",
                link: "admin-products-readonly.html",
                badge: "عرض"
            },
            {
                title: "📁 الأقسام",
                desc: "إدارة الأقسام الرئيسية والفرعية مع صلاحية التعديل والحذف.",
                icon: "fas fa-folder-tree",
                link: "admin-categories.html",
                badge: ""
            },
            {
                title: "🏷️ معرفات السلع",
                desc: "تعيين المعرفات (4 أرقام) للمنتجات والتحقق من النطاقات.",
                icon: "fas fa-tag",
                link: "admin-itemids.html",
                badge: "مهم"
            },
            {
                title: "📊 نطاقات المعرفات",
                desc: "إدارة النطاقات الرقمية المسموحة لكل قسم فرعي.",
                icon: "fas fa-chart-line",
                link: "admin-ranges.html",
                badge: "تخصيص"
            },
            {
                title: "📈 الإحصائيات الأساسية",
                desc: "مراقبة الطلبات، الزوار، وحالة الطلبات (معلقة/موصولة).",
                icon: "fas fa-chart-simple",
                link: "admin-stats.html",
                badge: ""
            },
            {
                title: "📊 الإحصائيات المتقدمة",
                desc: "تحليلات متقدمة مع رسوم بيانية وأفضل المنتجات والأقسام.",
                icon: "fas fa-chart-pie",
                link: "admin-stats-advanced.html",
                badge: "ذكاء الأعمال"
            },
            {
                title: "🖼️ البانرات الإعلانية",
                desc: "إدارة البانرات المعروضة في المتجر مع ضغط تلقائي للصور.",
                icon: "fas fa-images",
                link: "banners.html",
                badge: "تسويق"
            },
            {
                title: "⚙️ لوحة التحكم الرئيسية",
                desc: "الوصول السريع إلى لوحة الإدارة الأساسية.",
                icon: "fas fa-tachometer-alt",
                link: "admin.html",
                badge: ""
            }
        ];

        // Render dashboard tools
        function renderDashboard() {
            if (!toolsGrid) return;
            toolsGrid.innerHTML = adminTools.map(tool => `
                <a href="${tool.link}" class="tool-card" target="_self">
                    <div class="tool-icon"><i class="${tool.icon}"></i></div>
                    <div class="tool-title">${tool.title}</div>
                    <div class="tool-desc">${tool.desc}</div>
                    ${tool.badge ? `<div class="tool-badge">${tool.badge}</div>` : ''}
                </a>
            `).join('');
        }

        // Update UI based on auth state
        function updateUIForUser(user) {
            if (user) {
                // User is logged in
                loginSection.classList.add('hidden');
                dashboardSection.classList.remove('hidden');
                userInfoArea.style.display = 'flex';
                userEmailSpan.textContent = user.email;
                // Set sessionStorage for compatibility with existing admin pages
                sessionStorage.setItem('adminLoggedIn', 'true');
                sessionStorage.setItem('adminEmail', user.email);
                // Render tools
                renderDashboard();
                showToast(`مرحباً ${user.email}`, 'success');
            } else {
                // No user: show login, hide dashboard
                loginSection.classList.remove('hidden');
                dashboardSection.classList.add('hidden');
                userInfoArea.style.display = 'none';
                sessionStorage.removeItem('adminLoggedIn');
                sessionStorage.removeItem('adminEmail');
                // Clear any error
                loginError.classList.remove('show');
                loginError.innerHTML = '';
                // Reset form fields (optional)
                loginEmail.value = '';
                loginPassword.value = '';
            }
        }

        // Handle login form submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = loginEmail.value.trim();
            const password = loginPassword.value;
            
            if (!email || !password) {
                loginError.innerHTML = '❌ يرجى إدخال البريد الإلكتروني وكلمة المرور';
                loginError.classList.add('show');
                return;
            }
            
            // Disable button and show loading
            loginBtn.disabled = true;
            const originalBtnText = loginBtn.innerHTML;
            loginBtn.innerHTML = '<span class="loading-spinner"></span> جاري التحقق...';
            
            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                // Success handled by onAuthStateChanged
                showToast('تم تسجيل الدخول بنجاح!', 'success');
                loginError.classList.remove('show');
            } catch (error) {
                console.error('Login error:', error);
                let errorMessage = '❌ فشل تسجيل الدخول. ';
                switch (error.code) {
                    case 'auth/invalid-email':
                        errorMessage += 'البريد الإلكتروني غير صالح.';
                        break;
                    case 'auth/user-disabled':
                        errorMessage += 'هذا الحساب معطل.';
                        break;
                    case 'auth/user-not-found':
                        errorMessage += 'لا يوجد حساب مرتبط بهذا البريد.';
                        break;
                    case 'auth/wrong-password':
                        errorMessage += 'كلمة المرور غير صحيحة.';
                        break;
                    default:
                        errorMessage += 'يرجى التحقق من بيانات الدخول والمحاولة مرة أخرى.';
                }
                loginError.innerHTML = errorMessage;
                loginError.classList.add('show');
                showToast(errorMessage, 'error');
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = originalBtnText;
            }
        });

        // Handle logout
        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
                showToast('تم تسجيل الخروج بنجاح', 'success');
                // UI will update via onAuthStateChanged
            } catch (error) {
                console.error('Logout error:', error);
                showToast('خطأ أثناء تسجيل الخروج', 'error');
            }
        });

        // Monitor auth state (persists across page reloads)
        onAuthStateChanged(auth, (user) => {
            updateUIForUser(user);
            // Additionally, if user is logged in but sessionStorage missing for some reason, set it
            if (user && !sessionStorage.getItem('adminLoggedIn')) {
                sessionStorage.setItem('adminLoggedIn', 'true');
                sessionStorage.setItem('adminEmail', user.email);
            }
        });

        // For extra security: if sessionStorage indicates logged in but Firebase says not,
        // we force logout on next page? No, but we rely on Firebase. However to protect
        // existing admin pages which check sessionStorage only, we set it on login.
        // Also we listen to page load to ensure sessionStorage matches Firebase (edge case)
        window.addEventListener('load', () => {
            const currentUser = auth.currentUser;
            if (currentUser && !sessionStorage.getItem('adminLoggedIn')) {
                sessionStorage.setItem('adminLoggedIn', 'true');
                sessionStorage.setItem('adminEmail', currentUser.email);
            } else if (!currentUser && sessionStorage.getItem('adminLoggedIn')) {
                // Inconsistent: clear it
                sessionStorage.removeItem('adminLoggedIn');
                sessionStorage.removeItem('adminEmail');
            }
        });
    </script>
</body>
</html>
